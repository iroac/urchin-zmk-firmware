# The dongle is USB-powered, not battery-powered, so deep sleep has no
# battery benefit here. ZMK already skips deep sleep while USB power is
# present (see is_usb_power_present() in activity.c), but the dongle's
# mock kscan has zero pins configured as a wake source, so if that
# check were ever bypassed (e.g. a clone board with unreliable VBUS
# detection), it would have no way to wake up short of a physical
# unplug/replug. Disabling it outright removes that dependency.
CONFIG_ZMK_SLEEP=n
