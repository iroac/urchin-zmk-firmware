# enable bluetooth
CONFIG_BT=y

# Radio TX power: left at the 0 dBm default on purpose.
# +8 dBm is the nRF52840 maximum and roughly quadruples radio current on
# every single TX event. It buys nothing in a dongle build - the halves
# only ever talk to the dongle sitting on the same desk, not to a PC
# across the room. Re-enable only if you get dropouts.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- POWER MANAGEMENT ---

# enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Deep sleep after inactivity: the half disconnects from bluetooth and
# draws almost nothing, at the cost of a ~1-2 s reconnect on the next
# keypress. 600.000 ms = 10 minutes (ZMK's own default is 15).
# This is the only setting that reclaims the idle hours between sessions,
# so keep it well under the length of a typical break.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Report battery level every 10 minutes instead of every 60 s. Each report
# is an ADC read plus a BLE notify, and the halves run tiny cells.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600

# No OLED and no LEDs on the halves in this build (the nice_view shields
# were dropped from build.yaml). Pin them off so a module or shield
# default can never quietly switch them back on.
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

# "Eager Debouncing"
# Trying to lower the input lag.
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# enable mouse keys / pointing device support
CONFIG_ZMK_POINTING=y
